<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoinTap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Firebase: admin panelda barcha userlarni korish uchun -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #1b1033 0%, #0a0612 60%, #060410 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; position: relative; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px 6px;
  }
  .profile { display: flex; align-items: center; gap: 8px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #ffb347, #ff7a00);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #2b1400;
  }
  .name { font-size: 14px; font-weight: 600; color: #e7e1ff; }
  .level-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600;
    color: #c9beff;
  }

  .balance-wrap { text-align: center; margin-top: 6px; }
  .balance {
    font-size: 42px; font-weight: 800; letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .coin-icon-small {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #ffb627 60%, #c97e00 100%);
    box-shadow: inset 0 -3px 5px rgba(0,0,0,0.25), 0 2px 4px rgba(0,0,0,0.3);
  }
  .per-tap { font-size: 12px; color: #9d92c9; margin-top: 4px; }

  .progress-wrap { padding: 0 24px; margin-top: 14px; }
  .progress-bar-bg {
    height: 8px; border-radius: 6px; background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, #7b5cff, #c46bff);
    transition: width 0.3s ease;
  }
  .progress-label {
    display: flex; justify-content: space-between; font-size: 11px; color: #8a7fb8; margin-top: 4px;
  }

  .tap-zone {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .coin-ring {
    width: 230px; height: 230px; border-radius: 50%;
    background: conic-gradient(from 0deg, #7b5cff, #ff7ad9, #ffd166, #7b5cff);
    display: flex; align-items: center; justify-content: center;
    padding: 6px;
    box-shadow: 0 0 60px rgba(123,92,255,0.35);
  }
  .coin {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3cf, #ffc23d 55%, #b87600 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -10px 20px rgba(0,0,0,0.25), inset 0 8px 14px rgba(255,255,255,0.4), 0 10px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.06s ease;
    font-size: 54px; font-weight: 900; color: rgba(150,90,0,0.45);
  }
  .coin.pressed { transform: scale(0.92); }

  .float-num {
    position: absolute;
    font-size: 22px; font-weight: 800; color: #ffe27a;
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.3); }
  }

  .energy-wrap {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 24px 4px; font-size: 13px; color: #c9beff; font-weight: 600;
  }
  .bolt {
    width: 16px; height: 16px;
    background: #ffe27a;
    clip-path: polygon(60% 0%, 0% 60%, 45% 60%, 35% 100%, 100% 35%, 55% 35%);
  }
  .energy-bar-bg {
    flex: 1; height: 10px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .energy-bar-fill {
    height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, #ffd166, #ff9d4d);
    transition: width 0.2s ease;
  }

  .bottom-nav {
    display: flex; justify-content: space-around;
    padding: 10px 10px 18px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .nav-btn {
    flex: 1; margin: 0 4px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
    font-size: 11px; font-weight: 600; color: #b9aee8;
    cursor: pointer;
  }
  .nav-btn.active {
    background: linear-gradient(135deg, rgba(123,92,255,0.35), rgba(255,122,217,0.25));
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }

  .panel {
    position: absolute; inset: 0;
    background: #0a0612;
    display: none;
    flex-direction: column;
    padding: 18px;
    overflow-y: auto;
  }
  .panel.open { display: flex; }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .panel-title { font-size: 18px; font-weight: 800; }
  .close-btn {
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }

  .upgrade-card {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .upgrade-info { display: flex; flex-direction: column; gap: 2px; }
  .upgrade-name { font-size: 14px; font-weight: 700; }
  .upgrade-desc { font-size: 11px; color: #9d92c9; }
  .upgrade-level { font-size: 11px; color: #c9beff; margin-top: 2px; }
  .upgrade-btn {
    background: linear-gradient(135deg, #7b5cff, #c46bff);
    border: none; color: #fff; font-weight: 700; font-size: 12px;
    padding: 9px 14px; border-radius: 10px; cursor: pointer;
    min-width: 78px;
  }
  .upgrade-btn:disabled { opacity: 0.4; }

  .stat-row {
    display: flex; justify-content: space-between;
    background: rgba(255,255,255,0.05);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 10px;
    font-size: 13px;
  }
  .stat-row span:first-child { color: #9d92c9; }
  .stat-row span:last-child { font-weight: 700; }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="profile">
      <div class="avatar" id="avatarLetter">U</div>
      <div>
        <div class="name" id="userName">Foydalanuvchi</div>
      </div>
    </div>
    <div class="level-pill" id="levelPill">Daraja 1</div>
  </div>

  <div class="balance-wrap">
    <div class="balance"><div class="coin-icon-small"></div><span id="balanceVal">0</span></div>
    <div class="per-tap" id="perTapLabel">+1 / bosish</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="levelFill" style="width:0%"></div></div>
    <div class="progress-label">
      <span id="levelCur">0</span>
      <span id="levelNext">1000</span>
    </div>
  </div>

  <div class="tap-zone" id="tapZone">
    <div class="coin-ring">
      <div class="coin" id="coinBtn">CT</div>
    </div>
  </div>

  <div class="energy-wrap">
    <div class="bolt"></div>
    <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill" style="width:100%"></div></div>
    <span id="energyVal">1000/1000</span>
  </div>

  <div class="bottom-nav">
    <div class="nav-btn active" data-panel="main" id="navMain">Bosh sahifa</div>
    <div class="nav-btn" data-panel="upgrades" id="navUpgrades">Kuchaytirish</div>
    <div class="nav-btn" data-panel="stats" id="navStats">Statistika</div>
  </div>

  <div class="panel" id="panelUpgrades">
    <div class="panel-header">
      <div class="panel-title">Kuchaytirishlar</div>
      <button class="close-btn" data-close="upgrades">x</button>
    </div>
    <div id="upgradesList"></div>
  </div>

  <div class="panel" id="panelStats">
    <div class="panel-header">
      <div class="panel-title">Statistika</div>
      <button class="close-btn" data-close="stats">x</button>
    </div>
    <div class="stat-row"><span>Jami tangalar</span><span id="statTotal">0</span></div>
    <div class="stat-row"><span>Jami bosishlar</span><span id="statTaps">0</span></div>
    <div class="stat-row"><span>Bosishdagi daromad</span><span id="statPerTap">1</span></div>
    <div class="stat-row"><span>Soniyadagi daromad</span><span id="statPerSec">0</span></div>
    <div class="stat-row"><span>Daraja</span><span id="statLevel">1</span></div>
    <div class="stat-row"><span>Maksimal energiya</span><span id="statMaxEnergy">1000</span></div>
  </div>

</div>

<script>
(function(){
  // ====== FIREBASE CONFIG (shu yerga o'z Firebase loyihangiz config'ini qo'ying) ======
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT"
  };
  let fbReady = false;
  let db = null;
  try {
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      fbReady = true;
    }
  } catch(e) { console.warn('Firebase init xato:', e); }

  function syncToCloud() {
    if (!fbReady) return;
    try {
      db.ref('users/' + userId).set({
        name: userName,
        balance: Math.floor(state.balance),
        totalEarned: Math.floor(state.totalEarned),
        totalTaps: state.totalTaps,
        level: state.level,
        updatedAt: Date.now()
      });
    } catch(e) { console.warn('Sync xato:', e); }
  }

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor('#0a0612'); } catch(e){} }
  }

  let tgUser = null;
  try { tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null; } catch(e) {}
  const userId = tgUser ? String(tgUser.id) : 'guest';
  const userName = tgUser ? (tgUser.first_name || 'Foydalanuvchi') : 'Mehmon';
  document.getElementById('userName').textContent = userName;
  document.getElementById('avatarLetter').textContent = userName.charAt(0).toUpperCase();

  const STORAGE_KEY = 'cointap_state_' + userId;

  const UPGRADE_DEFS = [
    { id: 'tap', name: 'Bosish kuchi', desc: 'Har bir bosishdan koproq tanga olasiz', baseCost: 50, mult: 1.6, baseEffect: 1 },
    { id: 'energy', name: 'Energiya hajmi', desc: 'Maksimal energiyani oshiradi', baseCost: 80, mult: 1.7, baseEffect: 100 },
    { id: 'regen', name: 'Energiya tezligi', desc: 'Energiya tezroq tiklanadi', baseCost: 120, mult: 1.8, baseEffect: 1 },
    { id: 'auto', name: 'Avto-yigувchi', desc: 'Har soniyada avtomatik tanga', baseCost: 200, mult: 2.0, baseEffect: 1 }
  ];

  function defaultState() {
    return {
      balance: 0,
      totalEarned: 0,
      totalTaps: 0,
      energy: 1000,
      maxEnergy: 1000,
      level: 1,
      upgrades: { tap: 0, energy: 0, regen: 0, auto: 0 },
      lastTs: Date.now()
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return Object.assign(defaultState(), parsed);
    } catch(e) { return defaultState(); }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
    syncToCloud();
  }

  let state = loadState();

  function perTap() {
    return 1 + state.upgrades.tap * UPGRADE_DEFS[0].baseEffect;
  }
  function maxEnergy() {
    return 1000 + state.upgrades.energy * UPGRADE_DEFS[1].baseEffect;
  }
  function regenRate() {
    return 1 + state.upgrades.regen * UPGRADE_DEFS[2].baseEffect;
  }
  function autoPerSec() {
    return state.upgrades.auto * UPGRADE_DEFS[3].baseEffect * 2;
  }
  function levelThreshold(lvl) {
    return Math.floor(1000 * Math.pow(1.5, lvl - 1));
  }
  function upgradeCost(def, currentLevel) {
    return Math.floor(def.baseCost * Math.pow(def.mult, currentLevel));
  }

  function applyOfflineProgress() {
    const now = Date.now();
    const diffSec = Math.max(0, Math.floor((now - state.lastTs) / 1000));
    if (diffSec > 0) {
      state.energy = Math.min(maxEnergy(), state.energy + diffSec * regenRate());
      const offlineCap = Math.min(diffSec, 3600);
      const earned = offlineCap * autoPerSec();
      if (earned > 0) {
        state.balance += earned;
        state.totalEarned += earned;
      }
    }
    state.lastTs = now;
  }

  applyOfflineProgress();

  function checkLevelUp() {
    while (state.totalEarned >= levelThreshold(state.level)) {
      state.level += 1;
    }
  }
  checkLevelUp();

  const balanceVal = document.getElementById('balanceVal');
  const perTapLabel = document.getElementById('perTapLabel');
  const levelFill = document.getElementById('levelFill');
  const levelCur = document.getElementById('levelCur');
  const levelNext = document.getElementById('levelNext');
  const levelPill = document.getElementById('levelPill');
  const energyFill = document.getElementById('energyFill');
  const energyVal = document.getElementById('energyVal');
  const coinBtn = document.getElementById('coinBtn');
  const tapZone = document.getElementById('tapZone');

  function fmt(n) {
    n = Math.floor(n);
    if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'K';
    return String(n);
  }

  function render() {
    balanceVal.textContent = fmt(state.balance);
    perTapLabel.textContent = '+' + perTap() + ' / bosish';
    levelPill.textContent = 'Daraja ' + state.level;

    const prevThreshold = state.level > 1 ? levelThreshold(state.level - 1) : 0;
    const nextThreshold = levelThreshold(state.level);
    const progressInLevel = state.totalEarned - prevThreshold;
    const levelSpan = nextThreshold - prevThreshold;
    const pct = Math.max(0, Math.min(100, (progressInLevel / levelSpan) * 100));
    levelFill.style.width = pct + '%';
    levelCur.textContent = fmt(state.totalEarned);
    levelNext.textContent = fmt(nextThreshold);

    const me = maxEnergy();
    const epct = Math.max(0, Math.min(100, (state.energy / me) * 100));
    energyFill.style.width = epct + '%';
    energyVal.textContent = Math.floor(state.energy) + '/' + me;

    document.getElementById('statTotal').textContent = fmt(state.totalEarned);
    document.getElementById('statTaps').textContent = state.totalTaps;
    document.getElementById('statPerTap').textContent = perTap();
    document.getElementById('statPerSec').textContent = autoPerSec();
    document.getElementById('statLevel').textContent = state.level;
    document.getElementById('statMaxEnergy').textContent = me;
  }

  function spawnFloat(x, y, amount) {
    const el = document.createElement('div');
    el.className = 'float-num';
    el.textContent = '+' + amount;
    el.style.left = (x - 10) + 'px';
    el.style.top = (y - 20) + 'px';
    tapZone.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function doTap(clientX, clientY) {
    if (state.energy < 1) return;
    const gain = perTap();
    state.balance += gain;
    state.totalEarned += gain;
    state.totalTaps += 1;
    state.energy = Math.max(0, state.energy - 1);
    checkLevelUp();

    const rect = tapZone.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    spawnFloat(x, y, gain);

    coinBtn.classList.add('pressed');
    setTimeout(() => coinBtn.classList.remove('pressed'), 90);

    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
    }

    render();
    saveState();
  }

  coinBtn.addEventListener('click', function(e) {
    doTap(e.clientX, e.clientY);
  });
  coinBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    doTap(t.clientX, t.clientY);
  }, { passive: false });

  setInterval(function() {
    state.energy = Math.min(maxEnergy(), state.energy + regenRate());
    const auto = autoPerSec();
    if (auto > 0) {
      state.balance += auto;
      state.totalEarned += auto;
      checkLevelUp();
    }
    state.lastTs = Date.now();
    render();
    saveState();
  }, 1000);

  function renderUpgrades() {
    const list = document.getElementById('upgradesList');
    list.innerHTML = '';
    UPGRADE_DEFS.forEach(function(def) {
      const lvl = state.upgrades[def.id];
      const cost = upgradeCost(def, lvl);
      const card = document.createElement('div');
      card.className = 'upgrade-card';
      card.innerHTML =
        '<div class="upgrade-info">' +
          '<div class="upgrade-name">' + def.name + '</div>' +
          '<div class="upgrade-desc">' + def.desc + '</div>' +
          '<div class="upgrade-level">Daraja: ' + lvl + '</div>' +
        '</div>' +
        '<button class="upgrade-btn" ' + (state.balance < cost ? 'disabled' : '') + '>' + fmt(cost) + '</button>';
      const btn = card.querySelector('button');
      btn.addEventListener('click', function() {
        if (state.balance < cost) return;
        state.balance -= cost;
        state.upgrades[def.id] += 1;
        if (def.id === 'energy') {
          state.energy = Math.min(maxEnergy(), state.energy);
        }
        saveState();
        render();
        renderUpgrades();
      });
      list.appendChild(card);
    });
  }

  const navMain = document.getElementById('navMain');
  const navUpgrades = document.getElementById('navUpgrades');
  const navStats = document.getElementById('navStats');
  const panelUpgrades = document.getElementById('panelUpgrades');
  const panelStats = document.getElementById('panelStats');

  function setActive(btn) {
    [navMain, navUpgrades, navStats].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  navMain.addEventListener('click', function() {
    panelUpgrades.classList.remove('open');
    panelStats.classList.remove('open');
    setActive(navMain);
  });
  navUpgrades.addEventListener('click', function() {
    panelStats.classList.remove('open');
    renderUpgrades();
    panelUpgrades.classList.add('open');
    setActive(navUpgrades);
  });
  navStats.addEventListener('click', function() {
    panelUpgrades.classList.remove('open');
    render();
    panelStats.classList.add('open');
    setActive(navStats);
  });

  document.querySelectorAll('.close-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      panelUpgrades.classList.remove('open');
      panelStats.classList.remove('open');
      setActive(navMain);
    });
  });

  window.addEventListener('beforeunload', function() {
    state.lastTs = Date.now();
    saveState();
  });

  render();
})();
</script>
</body>
</html>
